<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Check text · Tells</title>
<link rel="stylesheet" href="ui.css">
<body class="page">
<main>
  <h1>Check text</h1>
  <label class="lbl" for="t-in">Paste a draft or a message</label>
  <textarea id="t-in" spellcheck="false" autocomplete="off"></textarea>
  <label class="row"><input type="checkbox" data-hints> <span>Include weaker tells</span></label>
  <p class="sum" data-sum aria-live="polite"></p>
  <ol class="notes" data-notes></ol>
</main>
<script type="module" src="check.js"></script>
</body>
</html>
